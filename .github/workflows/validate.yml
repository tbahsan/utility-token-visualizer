name: validate
on: [push, pull_request]
jobs:
  json-and-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          python3 -c "import json,glob; [json.load(open(f,encoding='utf-8')) for f in glob.glob('**/*.json',recursive=True)]; print('JSON OK')"
      - name: i18n parity check (bn-first)
        run: |
          python3 - <<'EOF'
          import json
          bn = json.load(open('i18n/bn.json', encoding='utf-8'))
          en = json.load(open('i18n/en.json', encoding='utf-8'))
          missing_en = [k for k in bn if k not in en or not str(en[k]).strip()]
          missing_bn = [k for k in en if k not in bn or not str(bn[k]).strip()]
          extra_en = [k for k in en if k not in bn]
          assert not missing_en, f"Missing/empty in en.json: {missing_en}"
          assert not missing_bn, f"Missing/empty in bn.json: {missing_bn}"
          assert not extra_en, f"Extra keys in en.json: {extra_en}"
          print(f"i18n OK ({len(bn)} keys)")
          EOF
      - name: Tariff sanity check
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('tariffs/tariffs.json', encoding='utf-8'))['defaults']
          rates = [s['rate'] for s in d['slabs'] if not s.get('lifeline')]
          assert rates == sorted(rates), "Slab rates must be ascending"
          assert d['vat_percent'] == 5.0, "VAT must be 5%"
          print("tariff OK")
          EOF
